[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rewire"
version = "0.1.0"
description = "Own your brain, transfer it anywhere: portable synaptic memory for agent harnesses"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic"]
semantic = ["wordllama", "numpy"]

[project.scripts]
rewire = "rewire.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rewire = ["templates/*"]
