name: Release

# Pushing a tag like v0.2.0 builds the rewire binary for Linux and macOS and attaches it to a GitHub release,
# so installing does not need a Rust toolchain. The Linux binary is static (musl): it runs on any distribution.
on:
  push:
    tags: ["v*"]

# read-only for the jobs that build (and so run dependencies' build scripts); only the release job may write
permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match rust/Cargo.toml version $version"
            exit 1
          fi

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            test: true
          - os: macos-latest
            target: aarch64-apple-darwin
            test: true
          - os: macos-latest # Apple silicon runner, cross-compiling for Intel Macs
            target: x86_64-apple-darwin
            test: false
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ${{ matrix.target }}
      - if: matrix.test
        run: cargo test --locked --release --target ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package
        run: |
          name=rewire-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/rewire "$name/"
          cp ../README.md ../LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            rust/rewire-*.tar.gz
            rust/rewire-*.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            rewire-*.tar.gz
            rewire-*.tar.gz.sha256
