<section class="sec" style="padding-top:30px">
  <div class="hud">// 01b — WHAT REWIRE ACTUALLY DOES (HOVER THE CENTER)</div>
  <svg id="syn2" viewBox="0 0 1000 240" style="cursor:pointer">
    <g id="core">
      <circle id="corecirc" cx="500" cy="120" r="52" fill="#140f33" stroke="#b09dff" stroke-width="1.8"/>
      <text x="500" y="127" text-anchor="middle" class="lblb" font-size="14">REWIRE ⌁</text>
    </g>
    <text x="120" y="126" text-anchor="middle" class="lblb" opacity=".6">AGENT</text>
    <text x="880" y="126" text-anchor="middle" class="lblb" opacity=".6">BRAIN (GIT)</text>
    <text id="say" x="500" y="222" text-anchor="middle" class="lbl">hover the center neuron…</text>
  </svg>
</section>

<script>
  /* hover center → tampilkan dua arah flow sebagai teks bergantian + ring pulse */
  const svg = document.getElementById("syn2");
  const say = document.getElementById("say");
  const core = document.getElementById("core");
  const lines = [
    "IN  ← raw transcripts (hooks SessionEnd / PreCompact)  ·  0 LLM tokens to store",
    "⟳   consolidation: extract → judge → gate  ·  the only LLM step  ·  git commit",
    "OUT → prime at session start  ·  recall via MCP  ·  ≤5 notes, fenced & re-scanned",
  ];
  let i = 0, timer = null;
  const ring = document.createElementNS("http://www.w3.org/2000/svg","circle");
  ring.setAttribute("cx",500); ring.setAttribute("cy",120); ring.setAttribute("r",52);
  ring.setAttribute("fill","none"); ring.setAttribute("stroke","#fdf9c4"); ring.setAttribute("opacity",0);
  core.appendChild(ring);
  svg.addEventListener("mouseenter", () => {
    timer = setInterval(() => {
      say.textContent = lines[i % lines.length];
      i++;
      ring.animate([{opacity:.9,r:52},{opacity:0,r:200}], {duration:1400, easing:"ease-out"});
    }, 1600);
  });
  svg.addEventListener("mouseleave", () => { clearInterval(timer); say.textContent = "hover the center neuron…"; });
</script>
